  <text x="720" y="118" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">wrap when | comes</text>
  <text x="660" y="138" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;alt&#39;, node, cat())</text>
  <rect x="644" y="174" width="288" height="52" rx="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/>
  <text x="660" y="192" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">cat</text>
  <text x="720" y="192" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">wrap if anything but end, | or ) follows</text>
  <text x="660" y="212" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;cat&#39;, node, rep())</text>
  <rect x="644" y="248" width="288" height="52" rx="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/>
  <text x="660" y="266" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">rep</text>
  <text x="720" y="266" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">wrap when * or ? comes</text>
  <text x="660" y="286" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;star&#39;, node)  (&#39;opt&#39;, node)</text>
  <rect x="644" y="322" width="288" height="52" rx="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/>
  <text x="660" y="340" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">atom</text>
  <text x="720" y="340" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">take 1 char. ( goes to alt</text>
  <text x="660" y="360" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;sym&#39;, c)</text>
  <path d="M704,154 L704,170" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <path d="M704,228 L704,244" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <path d="M704,302 L704,318" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="720" y="162" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">call the stronger one first</text>
  <text x="628" y="126" font-size="12" fill="#888" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">weak</text>
  <text x="628" y="348" font-size="12" fill="#888" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">strong</text>
  <line x1="628" y1="140" x2="628" y2="334" stroke="#e5e5e5" stroke-width="1"/>
  <path d="M932,348 C954,344 954,140 936,120" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#h)"/>
  <text x="644" y="394" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">what is inside ( is read again from alt.</text>
  <text x="644" y="414" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">the function recurses here, one nesting deeper</text>
  <text x="24" y="452" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">Union and concatenation wrap what came before as the left child on every read, so node grows leftwards (which is why 3 cats line up in the tree below)</text>
  <text x="24" y="474" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">rep alone has one child, so it wraps as (&#39;star&#39;, node) / (&#39;opt&#39;, node). atom does not wrap; it returns one character as (&#39;sym&#39;, c)</text>
  </svg>

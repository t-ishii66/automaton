<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 484" width="980" height="484" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbbbbb"/></marker></defs>
  <rect width="980" height="484" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" fill="#555" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">closure(nfa, states)</text>
  <text x="246" y="31" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">— follow ε only, and collect everywhere it reaches</text>
  <line x1="24" y1="46" x2="956" y2="46" stroke="#eeeeee" stroke-width="1"/>
  <line x1="320" y1="62" x2="320" y2="400" stroke="#eeeeee" stroke-width="1"/>
  <line x1="706" y1="62" x2="706" y2="400" stroke="#eeeeee" stroke-width="1"/>
  <text x="24" y="76" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">Two containers</text>
  <rect x="24" y="96" width="272" height="58" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
  <text x="42" y="116" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">out</text>
  <text x="86" y="116" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">states known to be reachable by ε</text>
  <text x="42" y="138" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">a set; this is the return value as it is</text>
  <rect x="24" y="172" width="272" height="58" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
  <text x="42" y="192" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">todo</text>
  <text x="96" y="192" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">the ones whose ε are not seen yet</text>
  <text x="42" y="214" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">part of out; empty means done</text>
  <text x="24" y="252" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">states is where it starts. Sometimes one</text>
  <text x="24" y="274" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">start state, sometimes a set move returned</text>
  <text x="24" y="302" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">both begin as states itself</text>
  <text x="24" y="330" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">for closure(nfa, [1])</text>
  <text x="24" y="354" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">out = {1}</text>
  <text x="130" y="354" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">todo = [1]</text>
  <text x="24" y="382" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">the order taken out does not affect the result</text>
  <text x="348" y="76" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">What one turn of the loop does</text>
  <text x="348" y="110" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">s = todo.pop()</text>
  <text x="348" y="130" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">take one off the end of todo</text>
  <text x="348" y="156" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">for sym, t in nfa.edges[s]:</text>
  <text x="348" y="176" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">look at each arrow leaving s</text>
  <text x="348" y="202" font-size="13" fill="#b45309" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">if sym is EPS and t not in out:</text>
  <text x="348" y="222" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">only ε arrows, and only first-time destinations</text>
  <text x="372" y="248" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">out.add(t)</text>
  <text x="348" y="268" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">collect it,</text>
  <text x="372" y="294" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">todo.append(t)</text>
  <text x="348" y="314" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">and stack it to look at later</text>
  <path d="M622,326 C648,312 648,128 630,112" fill="none" stroke="#bbbbbb" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="348" y="340" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">repeat until todo is empty</text>
  <text x="730" y="76" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">Why it stops</text>
  <text x="730" y="104" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">with * nested, as in (a*)*,</text>
  <text x="730" y="126" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">a ring of pure ε appears</text>
  <ellipse cx="786" cy="172" rx="18" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="786" y="172" font-size="12" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1</text>
  <ellipse cx="890" cy="172" rx="18" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="890" y="172" font-size="12" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">4</text>
  <path d="M800,162 C824,146 852,146 876,162" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#o)"/>
  <path d="M876,182 C852,198 824,198 800,182" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#o)"/>
  <text x="838" y="140" font-size="13" fill="#c2410c" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε</text>
  <text x="838" y="206" font-size="13" fill="#c2410c" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε</text>
  <text x="730" y="236" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">on the 2nd lap 1 is in out already,</text>
  <text x="730" y="258" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">so t not in out rejects it and it</text>
  <text x="730" y="280" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">is not stacked. There it stops</text>
  <text x="730" y="316" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">arrows with a symbol are not</text>
  <text x="730" y="338" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">followed at all here (move's job)</text>
  <line x1="24" y1="414" x2="956" y2="414" stroke="#eeeeee" stroke-width="1"/>
  <text x="24" y="442" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">return frozenset(out)</text>
  <text x="224" y="442" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">returned as a set; duplicates and order need no minding</text>
  <text x="24" y="468" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">this one set becomes one state of the DFA in the subset construction</text>
  <text x="560" y="468" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">State names top right are from the NFA of (a*)*, not a(a|b)*bb</text>
  </svg>

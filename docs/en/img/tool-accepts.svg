<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="24" y="28" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">accepts(dfa, "ababb") ─ s moves on exactly once per character</text>
  <ellipse cx="90" cy="120" rx="14" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="90" y="120" font-size="11" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">i</text>
  <text x="90" y="154" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">start</text>
  <ellipse cx="230" cy="120" rx="20" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="230" y="120" font-size="11" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1,2</text>
  <text x="230" y="154" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">read 1 char</text>
  <ellipse cx="370" cy="120" rx="14" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="370" y="120" font-size="11" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>
  <text x="370" y="154" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">read 2 chars</text>
  <ellipse cx="510" cy="120" rx="20" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="510" y="120" font-size="11" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">1,2</text>
  <text x="510" y="154" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">read 3 chars</text>
  <ellipse cx="650" cy="120" rx="14" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="650" y="120" font-size="11" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">3</text>
  <text x="650" y="154" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">read 4 chars</text>
  <ellipse cx="790" cy="120" rx="14" ry="15" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
  <text x="790" y="120" font-size="11" fill="#111" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">f</text>
  <text x="790" y="154" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">read 5 chars</text>
  <path d="M116,120 L200,120" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="160.0" y="96" font-size="13" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">a</text>
  <path d="M256,120 L340,120" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="300.0" y="96" font-size="13" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">b</text>
  <path d="M396,120 L480,120" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="440.0" y="96" font-size="13" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">a</text>
  <path d="M536,120 L620,120" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="580.0" y="96" font-size="13" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">b</text>
  <path d="M676,120 L760,120" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="720.0" y="96" font-size="13" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">b</text>
  <text x="790" y="68" font-size="11" fill="#111" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">accepting state</text>
  <text x="24" y="200" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">When the reading is over s is f. f is an accepting state, so True comes back.</text>
  <text x="24" y="224" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">No branching, no searching. The arrows number exactly the characters of the input: 5 characters, 5 steps.</text>
  <text x="24" y="256" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">If there is nowhere to go part way (b while at i, say), False right there. The rest is not read.</text>
</svg>

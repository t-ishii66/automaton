  <text x="400" y="550" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">That is: no continuation of the input changes the result</text>

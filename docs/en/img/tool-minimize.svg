  <rect x="820" y="219" width="58" height="26" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
  <text x="849.0" y="232" font-size="12.5" fill="#111" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">{ 3 }</text>
  <text x="560" y="268" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">2 groups → 4, so go round again</text>
  <text x="560" y="292" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">only i has no b destination, so it splits off here</text>
  <text x="560" y="316" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">3's b destination is in another group, so it parts from 1, 2</text>
  <text x="560" y="340" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">f and 3 share a key, but their groups differ, so no merge</text>
  <text x="24" y="380" font-size="13" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">Round 2 ─ more groups, so the keys change too. Build them all again</text>
  <text x="44" y="408" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">G0={f}  G1={i}  G2={1,2}  G3={3}</text>
  <text x="44" y="438" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">state</text>
  <text x="97.0" y="438" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">key</text>
  <text x="214.0" y="438" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">lands in</text>

  <text x="275.0" y="96" font-size="12.5" fill="#111" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">G1 = { i, 1, 2, 3 }</text>
  <text x="24" y="146" font-size="13" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">Round 1 ─ the key of each state (which symbols it can go on + which group each destination is in)</text>

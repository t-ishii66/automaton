  <text x="259.5" y="260.0" font-size="12.5" fill="#111" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">3</text>
  <text x="355.5" y="260.0" font-size="12.5" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">G1</text>
  <text x="422.0" y="260.0" font-size="12.5" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a→G1, b→G1</text>

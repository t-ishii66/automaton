  <text x="24" y="28" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">minimize ─ within a group, split what has a different key; repeat</text>
  <text x="24" y="64" font-size="13" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">(1) first split the accepting states from the rest</text>

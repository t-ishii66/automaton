  <text x="97.0" y="548.0" font-size="12.5" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">a→G2, b→G3</text>
  <text x="214.0" y="548.0" font-size="12.5" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">{ 1, 2 }</text>
  <line x1="38" y1="561.0" x2="284.0" y2="561.0" stroke="#f2f2f2" stroke-width="1"/>

  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="14" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">The nesting of the tuples is the depth of the tree</text>
  <text x="40" y="74" font-size="16.5" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;star&#39;, (&#39;alt&#39;, (&#39;sym&#39;, &#39;a&#39;), (&#39;sym&#39;, &#39;b&#39;)))</text>

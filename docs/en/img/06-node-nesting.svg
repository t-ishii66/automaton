  <text x="24" y="374" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">The further out the bracket, the higher up the tree. The innermost sym is a leaf.</text>

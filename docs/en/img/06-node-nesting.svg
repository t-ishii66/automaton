  <text x="24" y="182" font-size="13" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">3 levels as a tree</text>
  <line x1="380" y1="229" x2="380" y2="259" stroke="#cccccc" stroke-width="1.5"/>

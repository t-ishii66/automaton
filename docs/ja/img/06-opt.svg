<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">⑤ 省略 a?</text>
  <text x="24" y="52" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">('opt', a)</text>
  <ellipse cx="250" cy="120" rx="14" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="250" y="120" font-size="11" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">s</text>
  <ellipse cx="430" cy="120" rx="14" ry="15" fill="#ffffff" stroke="#111" stroke-width="1.8"/>
  <text x="430" y="120" font-size="11" fill="#111" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">t</text>
  <path d="M266,120 L407,120" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <text x="348" y="98" font-size="13" fill="#444" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">a</text>
  <path d="M250,135 C300,182 380,182 430,137" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#o)"/>
  <text x="340" y="194" font-size="12" fill="#c2410c" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">ε（本体を飛ばす）</text>
  <text x="250" y="76" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">入口</text>
  <text x="430" y="76" font-size="11" fill="#888" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">出口</text>
  <text x="560" y="96" font-size="13" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">④ 繰り返しとの違い</text>
  <text x="560" y="126" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">④ は ε を 4 本（入る・飛ばす・戻る・抜ける）</text>
  <text x="560" y="150" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">⑤ は「飛ばす」1 本だけ</text>
  <text x="560" y="178" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">戻る道が無いので、本体を通るのは多くても 1 回</text>
  <text x="24" y="228" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">新しい状態は本体が作る分だけ。⑤ 自身が足すのは ε の矢印 1 本である。</text>
</svg>

  <text x="628" y="126" font-size="12" fill="#888" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">弱</text>
  <text x="628" y="348" font-size="12" fill="#888" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">強</text>
  <line x1="628" y1="140" x2="628" y2="334" stroke="#e5e5e5" stroke-width="1"/>
  <path d="M932,348 C954,344 954,140 936,120" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#h)"/>
  <text x="644" y="394" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">( の中身は alt から読み直す。</text>
  <text x="644" y="414" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ここで関数が再帰し、入れ子が一段深くなる</text>
  <text x="24" y="452" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">選択と連接は、読むたびに「それまで」を左の子にして包むので、node は左へ伸びる（この後の木で cat が 3 つ並ぶのはこのため）</text>
  <text x="24" y="474" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">rep だけは子が 1 つなので (&#39;star&#39;, node) と包む。atom は包まず、1 文字を (&#39;sym&#39;, c) にして返す</text>
  </svg>

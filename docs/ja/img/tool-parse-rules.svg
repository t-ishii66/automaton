<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 496" width="980" height="496" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
  <rect width="980" height="496" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" fill="#555" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">alt / cat / rep / atom</text>
  <text x="268" y="31" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">— 4 つの規則が、そのまま 4 つの関数になる</text>
  <line x1="24" y1="46" x2="956" y2="46" stroke="#eeeeee" stroke-width="1"/>
  <line x1="612" y1="60" x2="612" y2="420" stroke="#eeeeee" stroke-width="1"/>
  <text x="24" y="74" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">どれも同じ形をしている</text>
  <text x="24" y="106" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">node = 一段強い規則()</text>
  <text x="330" y="106" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">まず 1 つ読む</text>
  <text x="24" y="132" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">while 目印が続く:</text>
  <text x="330" y="132" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">目印は関数ごとに違う（右の表）</text>
  <text x="55" y="158" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">node = (種類, node, 一段強い規則())</text>
  <text x="338" y="184" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">それまでの node を丸ごと左の子にして包み直す</text>
  <path d="M312,168 C334,170 328,178 334,182" fill="none" stroke="#b45309" stroke-width="1.6" marker-end="url(#h)"/>
  <text x="24" y="184" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">return node</text>
  <text x="24" y="222" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">cat が a (a|b)* b b を読むと、node はこう育つ</text>

  <text x="720" y="118" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">| が来たら包む</text>
  <text x="660" y="138" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;alt&#39;, node, cat())</text>
  <rect x="644" y="174" width="288" height="52" rx="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/>
  <text x="660" y="192" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">cat</text>
  <text x="720" y="192" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">終端・| ・) 以外が続けば包む</text>
  <text x="660" y="212" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;cat&#39;, node, rep())</text>
  <rect x="644" y="248" width="288" height="52" rx="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/>
  <text x="660" y="266" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">rep</text>
  <text x="720" y="266" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">* が来たら包む</text>
  <text x="660" y="286" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;star&#39;, node)</text>
  <rect x="644" y="322" width="288" height="52" rx="7" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/>
  <text x="660" y="340" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">atom</text>
  <text x="720" y="340" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">1 文字取る。( なら alt へ</text>
  <text x="660" y="360" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">(&#39;sym&#39;, c)</text>
  <path d="M704,154 L704,170" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>
  <path d="M704,228 L704,244" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#d)"/>

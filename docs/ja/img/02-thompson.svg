<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="455" y1="14" x2="455" y2="406"/>
    <line x1="14" y1="207" x2="886" y2="207"/>
  </g>
  <g fill="#666" font-size="15" font-weight="600">
    <text x="20" y="30">① 記号 a</text>
    <text x="480" y="30">② 連接 xy</text>
    <text x="20" y="240">③ 選択 x|y</text>
    <text x="480" y="240">④ 繰り返し x*</text>
  </g>

  <!-- (1) symbol -->
  <g fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a1)">
    <path d="M108,120 L232,120"/>
  </g>
  <text x="170" y="108" font-size="15" font-weight="600" fill="#444" text-anchor="middle">a</text>

  <!-- (2) concatenation -->
  <g fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a1)">
    <path d="M528,120 L672,120"/>
    <path d="M708,120 L852,120"/>
  </g>

  <!-- (3) alternation -->
  <g fill="none" stroke="#444" stroke-width="1.8" marker-end="url(#a1)">
    <path d="M76,322 C104,302 110,302 138,302"/>
    <path d="M232,302 C262,302 266,312 284,322"/>
    <path d="M76,338 C104,358 110,358 138,358"/>
    <path d="M232,358 C262,358 266,348 284,338"/>
  </g>

  <!-- (4) repetition -->
  <g fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#a2)">
    <path d="M528,330 L582,330"/>
    <path d="M768,330 L822,330"/>
    <path d="M760,314 C736,262 628,262 606,314"/>
    <path d="M510,348 C580,412 790,412 860,348"/>
  </g>
  <g fill="#c2410c" font-size="15" font-weight="600" text-anchor="middle">
    <text x="555" y="318">ε</text>
    <text x="795" y="318">ε</text>
    <text x="682" y="268">ε</text>
    <text x="685" y="404">ε</text>
  </g>

  <g fill="#ffffff" stroke="#333" stroke-width="1.8">
    <circle cx="90"  cy="120" r="18"/>
    <circle cx="250" cy="120" r="18"/>
    <circle cx="510" cy="120" r="18"/>
    <circle cx="690" cy="120" r="18"/>
    <circle cx="870" cy="120" r="18"/>
    <circle cx="60"  cy="330" r="18"/>
    <circle cx="300" cy="330" r="18"/>
    <circle cx="510" cy="330" r="18"/>
    <circle cx="600" cy="330" r="18"/>
    <circle cx="750" cy="330" r="18"/>
    <circle cx="840" cy="330" r="18"/>
  </g>

  <g fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4">
    <rect x="555" y="98"  width="90" height="44" rx="8"/>
    <rect x="735" y="98"  width="90" height="44" rx="8"/>
    <rect x="138" y="280" width="94" height="44" rx="8"/>
    <rect x="138" y="336" width="94" height="44" rx="8"/>
    <rect x="625" y="308" width="100" height="44" rx="8"/>
  </g>
  <g fill="#333" font-size="17" font-style="italic" text-anchor="middle" dominant-baseline="central">
    <text x="600" y="120">x</text>
    <text x="780" y="120">y</text>
    <text x="185" y="302">x</text>
    <text x="185" y="358">y</text>
    <text x="675" y="330">x</text>
  </g>
</svg>

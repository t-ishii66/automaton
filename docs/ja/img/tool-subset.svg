  <text x="24" y="262" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">★ が「まだ出ていない集合」で、これだけが states と todo に足される。</text>
  <text x="24" y="286" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">nxt は closure(move(nfa, cur, 記号)) で求める。同じ集合が再び出てきたら、もう調べ直さない。</text>
  <text x="24" y="310" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">todo が空になった時点で 5 つの集合が出揃い、それが DFA の 5 状態になる。</text>

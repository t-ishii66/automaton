  <text x="24" y="262" font-size="12.5" fill="#444" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">? がすることは、本体を通る道の脇に「飛ばす道」を 1 本用意することだけである。</text>
  <text x="24" y="284" font-size="12.5" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">足したのは ε の矢印 1 本。状態は 1 つも増えていない。</text>

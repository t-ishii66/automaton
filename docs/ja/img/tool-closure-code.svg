<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 468" width="980" height="468" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bbbbbb"/></marker></defs>
  <rect width="980" height="468" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" fill="#555" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">closure(nfa, states)</text>
  <text x="246" y="31" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">— ε だけを辿って、行ける先を全部集める</text>
  <line x1="24" y1="46" x2="956" y2="46" stroke="#eeeeee" stroke-width="1"/>
  <line x1="320" y1="62" x2="320" y2="384" stroke="#eeeeee" stroke-width="1"/>
  <line x1="706" y1="62" x2="706" y2="384" stroke="#eeeeee" stroke-width="1"/>
  <text x="24" y="76" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">2 つの入れ物</text>
  <rect x="24" y="96" width="272" height="58" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
  <text x="42" y="116" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">out</text>
  <text x="86" y="116" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε で行けると分かった状態</text>
  <text x="42" y="138" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">集合。これがそのまま返り値になる</text>
  <rect x="24" y="172" width="272" height="58" rx="7" fill="#ffffff" stroke="#cccccc" stroke-width="1.6"/>
  <text x="42" y="192" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">todo</text>
  <text x="96" y="192" font-size="12" fill="#333" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">まだ ε の先を調べていない状態</text>
  <text x="42" y="214" font-size="11" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">リスト。空になったら終わり</text>
  <text x="24" y="254" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">どちらも最初は states そのもの</text>
  <text x="24" y="282" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">closure(nfa, [1]) なら</text>
  <text x="24" y="306" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">out = {1}</text>
  <text x="130" y="306" font-size="13" fill="#888" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">todo = [1]</text>
  <text x="24" y="336" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">取り出す順は結果に影響しない</text>
  <text x="348" y="76" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">ループ 1 回でやること</text>
  <text x="348" y="110" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">s = todo.pop()</text>
  <text x="348" y="130" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">todo の末尾から 1 つ取り出す</text>
  <text x="348" y="156" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">for sym, t in nfa.edges[s]:</text>
  <text x="348" y="176" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">s から出ている矢印を 1 本ずつ見る</text>
  <text x="348" y="202" font-size="13" fill="#b45309" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">if sym is EPS and t not in out:</text>
  <text x="348" y="222" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε の矢印で、しかも初めて見る先だけ</text>
  <text x="372" y="248" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">out.add(t)</text>
  <text x="348" y="268" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">集めて、</text>
  <text x="372" y="294" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">todo.append(t)</text>
  <text x="348" y="314" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">あとで調べる分として積む</text>
  <path d="M622,326 C648,312 648,128 630,112" fill="none" stroke="#bbbbbb" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="348" y="340" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">todo が空になるまで繰り返す</text>
  <text x="730" y="76" font-size="13" fill="#666" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600">止まる理由</text>
  <ellipse cx="786" cy="128" rx="18" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="786" y="128" font-size="12" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">p</text>
  <ellipse cx="890" cy="128" rx="18" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
  <text x="890" y="128" font-size="12" fill="#999" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">q</text>
  <path d="M800,118 C824,102 852,102 876,118" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#o)"/>
  <path d="M876,138 C852,154 824,154 800,138" fill="none" stroke="#c2410c" stroke-width="1.6" marker-end="url(#o)"/>
  <text x="838" y="96" font-size="13" fill="#c2410c" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε</text>
  <text x="838" y="162" font-size="13" fill="#c2410c" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε</text>
  <text x="730" y="194" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">ε が輪になっていても、2 度目の</text>
  <text x="730" y="216" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">p と q は t not in out で弾かれ、</text>
  <text x="730" y="238" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">todo に積まれない</text>
  <text x="730" y="282" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">記号の付いた矢印は、ここでは</text>
  <text x="730" y="304" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">1 本も辿らない</text>
  <text x="730" y="330" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">（記号で進むのは move の仕事）</text>
  <line x1="24" y1="398" x2="956" y2="398" stroke="#eeeeee" stroke-width="1"/>
  <text x="24" y="426" font-size="13" fill="#111" text-anchor="start" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal">return frozenset(out)</text>
  <text x="224" y="426" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">集合として返す。重複も順番も気にしなくていい</text>
  <text x="24" y="452" font-size="12" fill="#888" text-anchor="start" dominant-baseline="central" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="normal">この集合 1 つが、部分集合構成では DFA の状態 1 つになる</text>
  </svg>
